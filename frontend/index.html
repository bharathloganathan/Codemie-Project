<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Management</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1>Student Management</h1>

      <section aria-labelledby="add-student-heading">
        <h2 id="add-student-heading">Add student</h2>
        <div id="message" class="message" role="status" aria-live="polite" hidden></div>

        <form id="student-form">
          <label for="studentName">Student name</label>
          <input id="studentName" name="studentName" type="text" required />

          <label for="studentEmail">Email</label>
          <input id="studentEmail" name="studentEmail" type="email" required />

          <label for="studentDepartment">Department</label>
          <select id="studentDepartment" name="studentDepartment" required>
            <option value="">Select department</option>
            <option value="Computer Science">Computer Science</option>
            <option value="Mathematics">Mathematics</option>
          </select>

          <label for="studentPhone">Phone (optional)</label>
          <input id="studentPhone" name="studentPhone" type="tel" maxlength="20" />

          <button type="submit">Add student</button>
        </form>
      </section>

      <section aria-labelledby="student-list-heading" class="student-list">
        <h2 id="student-list-heading">Student List</h2>

        <div id="student-list-empty" class="empty-state" hidden>No students found.</div>

        <div class="table-wrapper">
          <table id="student-table" class="student-table" hidden>
            <thead>
              <tr>
                <th scope="col">Id</th>
                <th scope="col">Name</th>
                <th scope="col">Email</th>
                <th scope="col">Department</th>
                <th scope="col">Phone</th>
                <th scope="col">Status</th>
                <th scope="col">Actions</th>
              </tr>
            </thead>
            <tbody id="student-table-body"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
